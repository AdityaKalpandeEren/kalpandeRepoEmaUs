name: US Alert Scan

on:
  schedule:
    # Scans cover the full extended session the bot trades: 4:00 AM ET
    # pre-market (config.MARKET_OPEN_HOUR; first scan 4:15 after
    # SKIP_FIRST_MINUTES) through the 8:00 PM ET after-hours close
    # (config.MARKET_CLOSE_HOUR). 4:00 ET = 08:00 UTC (EDT) / 09:00 UTC
    # (EST). The research paper trades square off on the day's last candle
    # (19:55 ET) and the EOD report goes out on the first run after
    # 20:00 ET, so the schedule must reach past 20:00 ET: that is 00:00 UTC
    # (EDT) / 01:00 UTC (EST) on the NEXT UTC day, hence the second line on
    # Tue-Sat. Both lines cover the DST superset - scan_once.py's
    # is_market_hours() / session_over() (zoneinfo, DST-aware) decide what
    # each run actually does, so edge runs are cheap.
    #
    # NOTE - GitHub's scheduler delays and silently drops scheduled runs
    # under load, so the PRIMARY trigger is an external cron-job.org job
    # calling workflow_dispatch every 2 minutes. This schedule is only a
    # backup. Duplicate triggers are safe: the concurrency group below
    # queues them, and the research pass processes every candle closed
    # since its last run, so nothing is skipped or double-booked.
    - cron: "*/5 8-23 * * 1-5"
    - cron: "*/5 0-1 * * 2-6"
  workflow_dispatch: {}   # manual runs + the cron-job.org trigger (every 2 min)

# Concurrency is set per JOB (not per workflow run) so the V3 job never
# delays the scan.

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write      # prune old caches (step below)
    timeout-minutes: 12
    # One scan at a time: the research paper-trading state (live_state/) is
    # read at the start of a run and written at the end, so two overlapping
    # runs would lose each other's trades. A trigger that arrives while a run
    # is in progress waits; the next run catches up on every candle closed
    # since the last one, so nothing is skipped.
    concurrency:
      group: us-alert-scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Paper-trading state + L_ML_META_V2's market-data cache survive
      # between runs via the Actions cache: restore the newest one, save a
      # new one at the end (a cache key can't be overwritten, hence the
      # per-run key).
      - name: Restore paper-trading state
        uses: actions/cache/restore@v4
        with:
          path: |
            live_state
            backtest/ml/cache
          key: live-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            live-state-

      - run: python scan_once.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Research/paper alerts + EOD report go to the same chat as
          # production (LIVE_RESEARCH_CHAT_ID left unset).
          # Gemini (free tier) scoring of news headlines for L_ML_META_V2;
          # falls back to the keyword lexicon if the key is missing or
          # the API errors.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Production EMA-cross / VWAP alerts: paused by default. Set the
          # repo variable PRODUCTION_ALERTS_ENABLED=true to resume them.
          PRODUCTION_ALERTS_ENABLED: ${{ vars.PRODUCTION_ALERTS_ENABLED || 'false' }}

      - name: Save paper-trading state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            live_state
            backtest/ml/cache
          key: live-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Each run saves a new live-state-<run_id> cache (~2 MB) and only the newest
      # is ever restored. ~5,000 stale copies pushed the repo past GitHub's
      # 10 GB cache limit (2026-10-06), so GitHub was evicting caches - which
      # can include the model / data-store caches of the other jobs. Keep the
      # newest 30; delete at most 40 per run (the backlog clears in a few hours).
      - name: Prune old paper-trading caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key live-state- --sort created_at --order desc --limit 300 \
            --json id,key --jq '.[] | select(.key | startswith("live-state-")) | .id' \
            | tail -n +31 | head -n 40 | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true

      # Downloadable copy of the day's report + the all-time trade log
      # (Actions run page -> Artifacts) - only on after-close runs, not
      # on every 5-minute scan.
      - name: Check ET hour
        id: et
        if: always()
        run: echo "hour=$(TZ=America/New_York date +%-H)" >> "$GITHUB_OUTPUT"

      - name: Upload paper-trading reports
        if: always() && steps.et.outputs.hour >= 20
        uses: actions/upload-artifact@v4
        with:
          name: paper-trading-${{ github.run_id }}
          path: |
            live_state/reports
            live_state/paper_trades_all.csv
          if-no-files-found: ignore
          retention-days: 30

  # US V3 (us_v3/live.py): Stocks-in-Play opening-range breakout + ML ranker,
  # paper only, Telegram alerts. Same trigger as the scan; each run does one
  # step: 09:00 ET prep (data refresh, weekly retrain), 09:35-10:30 breakout
  # entries, stop checks until 15:55, day report after 16:00.
  v3:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: us-v3
      cancel-in-progress: false
    steps:
      - name: Trading window check (Mon-Fri 09:00-16:15 ET)
        id: win
        run: |
          hhmm=$(TZ=America/New_York date +%H%M); dow=$(TZ=America/New_York date +%u)
          if [ "$dow" -le 5 ] && [ "$hhmm" -ge 0900 ] && [ "$hhmm" -le 1615 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "outside the US V3 window ($hhmm ET) - nothing to do"
          fi

      - uses: actions/checkout@v4
        if: steps.win.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.win.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.win.outputs.run == 'true'
        run: pip install -r requirements.txt -r us_v3/requirements-live.txt

      # V3 state + model + its growing 5-min store (own key prefix; never
      # mixes with the scan's live-state- cache)
      - name: Restore US V3 state + data
        if: steps.win.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            live_state/us_v3
            backtest/ml/cache/v3us
          key: us-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            us-v3-

      - name: Run US V3 step
        id: v3
        if: steps.win.outputs.run == 'true'
        timeout-minutes: 22
        run: python -m us_v3.live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save US V3 state + data
        if: always() && steps.win.outputs.run == 'true' && steps.v3.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            live_state/us_v3
            backtest/ml/cache/v3us
          key: us-v3-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload US V3 trades
        if: always() && steps.win.outputs.run == 'true' && steps.v3.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: us-v3-${{ github.run_id }}
          path: live_state/us_v3
          if-no-files-found: ignore
          retention-days: 30


  # US V5.0 swing model (us_v5/live.py): once per trading day, on the first
  # trigger after 09:35 ET - refreshes Yahoo daily bars to yesterday's close,
  # scores the top-100 S&P 500 universe, and every 5th session rebalances the
  # $100k paper portfolio (top 20) at today's open. Telegram: rebalance
  # orders or a daily portfolio update vs SPY. Later triggers the same day
  # exit at once (done-marker cache).
  v5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: us-v5
      cancel-in-progress: false
    steps:
      - name: Trading window check (Mon-Fri 09:35-16:00 ET)
        id: win
        run: |
          hhmm=$(TZ=America/New_York date +%H%M); dow=$(TZ=America/New_York date +%u)
          if [ "$dow" -le 5 ] && [ "$hhmm" -ge 0935 ] && [ "$hhmm" -le 1600 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "outside the US V5 window ($hhmm ET) - nothing to do"
          fi

      - name: Already done today?
        if: steps.win.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .us_v5_done
          key: us-v5-done-${{ github.run_id }}
          restore-keys: |
            us-v5-done-

      - name: Check marker date
        id: today
        if: steps.win.outputs.run == 'true'
        run: |
          d=$(TZ=America/New_York date +%F)
          if [ -f .us_v5_done ] && [ "$(cat .us_v5_done)" = "$d" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "US V5 already ran today ($d)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true'
        run: pip install -r requirements.txt -r us_v5/requirements-live.txt

      - name: Restore US V5 state + daily bars
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            live_state/us_v5
            us_v5/cache
          key: us-v5-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            us-v5-

      - name: Run US V5 step
        id: v5
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true'
        timeout-minutes: 25
        run: python -m us_v5.live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save US V5 state + daily bars
        if: always() && steps.win.outputs.run == 'true' && steps.v5.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            live_state/us_v5
            us_v5/cache
          key: us-v5-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Mark today done
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true' && steps.v5.outcome == 'success' && hashFiles('live_state/us_v5/state.json') != ''
        run: |
          d=$(TZ=America/New_York date +%F)
          if python -c "import json,sys; sys.exit(0 if json.load(open('live_state/us_v5/state.json')).get('last_day')=='$d' else 1)"; then
            echo "$d" > .us_v5_done; echo "marked $d"
          fi

      - name: Save done marker
        if: steps.win.outputs.run == 'true' && steps.today.outputs.skip != 'true' && hashFiles('.us_v5_done') != ''
        uses: actions/cache/save@v4
        with:
          path: .us_v5_done
          key: us-v5-done-${{ github.run_id }}

      - name: Upload US V5 trades
        if: always() && steps.win.outputs.run == 'true' && steps.v5.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: us-v5-${{ github.run_id }}
          path: live_state/us_v5
          if-no-files-found: ignore
          retention-days: 30

  # US SCR - Small-Cap Runners (us_scr/live.py): dynamic watchlist of listed
  # small / micro caps moving on volume (free Yahoo screener), "ride the wave"
  # breakout setups ranked by an ML model, tight stops, paper trades, own 🔥
  # Telegram format + volume-watch alerts. Same trigger as the scan.
  scr:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write      # prune this job's old caches (last step)
    concurrency:
      group: us-scr
      cancel-in-progress: false
    steps:
      - name: Trading window check (Mon-Fri 07:00-16:15 ET)
        id: win
        run: |
          hhmm=$(TZ=America/New_York date +%H%M); dow=$(TZ=America/New_York date +%u)
          if [ "$dow" -le 5 ] && [ "$hhmm" -ge 0700 ] && [ "$hhmm" -le 1615 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "outside the US SCR window ($hhmm ET) - nothing to do"
          fi

      - uses: actions/checkout@v4
        if: steps.win.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.win.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - if: steps.win.outputs.run == 'true'
        run: pip install -r requirements.txt -r us_scr/requirements-live.txt

      - name: Restore US SCR state + bar store
        if: steps.win.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            live_state/us_scr
            us_scr/cache
          key: us-scr-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            us-scr-

      - name: Run US SCR step
        id: scr
        if: steps.win.outputs.run == 'true'
        timeout-minutes: 9
        run: python -m us_scr.live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save US SCR state + bar store
        if: always() && steps.win.outputs.run == 'true' && steps.scr.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            live_state/us_scr
            us_scr/cache
          key: us-scr-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload US SCR trades
        if: always() && steps.win.outputs.run == 'true' && steps.scr.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: us-scr-${{ github.run_id }}
          path: live_state/us_scr
          if-no-files-found: ignore
          retention-days: 30

      # This job saves a new cache on most runs - keep only the newest 10.
      - name: Prune old US SCR caches
        if: always() && steps.win.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key us-scr- --sort created_at --order desc --limit 100 \
            --json id,key --jq '.[] | select(.key | startswith("us-scr-")) | .id' \
            | tail -n +11 | head -n 40 | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true
